<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>New Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root, [data-theme="dark"] {
      --bg:        #0b0c18;
      --surface:   #0d0e1c;
      --elevated:  #191b30;
      --text:      #e2e5f1;
      --sub:       #7b82a8;
      --muted:     #4a4f72;
      --green:     #1DB814;
      --border:    rgba(255,255,255,0.07);
      --divider:   rgba(255,255,255,0.05);
      --hover:     rgba(255,255,255,0.06);
      --green-bg:  rgba(29,184,20,0.10);
      --green-bd:  rgba(29,184,20,0.28);
      --toggle-bg: rgba(255,255,255,0.06);
      --input-bg:  #191b30;
      --font:      'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    }

    [data-theme="light"] {
      --bg:        #F2F2F7;
      --surface:   #FFFFFF;
      --elevated:  #E5E5EA;
      --text:      #000000;
      --sub:       #6C6C70;
      --muted:     #8E8E93;
      --green:     #1A9E12;
      --border:    rgba(0,0,0,0.14);
      --divider:   rgba(0,0,0,0.08);
      --hover:     rgba(0,0,0,0.06);
      --green-bg:  rgba(26,158,18,0.08);
      --green-bd:  rgba(26,158,18,0.28);
      --toggle-bg: rgba(0,0,0,0.07);
      --input-bg:  #FFFFFF;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      transition: background 0.2s ease, color 0.2s ease;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.20); border-radius: 10px; }

    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 48px;
      position: relative;
      gap: 0;
    }

    /* ── Theme toggle ── */
    .theme-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--toggle-bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--sub);
      font-family: var(--font);
      letter-spacing: 0.4px;
      transition: background 0.15s ease, color 0.15s ease;
      -webkit-app-region: no-drag;
    }
    .theme-btn:hover { background: var(--hover); color: var(--text); }
    .theme-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

    /* ── Wordmark ── */
    .wordmark {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
      animation: fadeIn 0.2s ease both;
    }

    /* ── Search bar ── */
    .search-wrap {
      width: 100%;
      max-width: 560px;
      margin-bottom: 20px;
      animation: fadeIn 0.2s 0.04s ease both;
      position: relative;
    }

    .search-box {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 14px;
      gap: 10px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      cursor: text;
    }
    .search-box.focused {
      border-color: rgba(29,184,20,0.55);
      box-shadow: 0 0 0 3px rgba(29,184,20,0.10);
    }
    .search-box svg {
      width: 15px; height: 15px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      transition: stroke 0.15s ease;
    }
    .search-box.focused svg { stroke: var(--green); }

    #searchInput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      caret-color: var(--green);
    }
    #searchInput::placeholder { color: var(--muted); }

    .search-go {
      background: var(--green);
      border: none;
      border-radius: 8px;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
    }
    .search-go.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .search-go svg {
      width: 13px; height: 13px;
      stroke: #ffffff !important;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .search-go:hover { opacity: 0.85; }
    .search-go:active { transform: scale(0.92); }

    /* ── Relay pill ── */
    .relay {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green-bg);
      border: 1px solid var(--green-bd);
      border-radius: 9999px;
      padding: 5px 12px;
      margin-bottom: 36px;
      animation: fadeIn 0.2s 0.08s ease both;
    }
    .relay-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 5px rgba(29,184,20,0.7);
    }
    .relay-text {
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
      letter-spacing: 0.5px;
    }

    /* ── Section label ── */
    .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      align-self: flex-start;
      width: 100%;
      max-width: 560px;
      margin-bottom: 8px;
      animation: fadeIn 0.2s 0.12s ease both;
    }

    /* ── Shortcut grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 560px;
      animation: fadeIn 0.2s 0.15s ease both;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      -webkit-user-select: none;
      user-select: none;
    }
    .card:hover {
      background: var(--elevated);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .card:active { transform: scale(0.96); box-shadow: none; }

    .card-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--elevated);
      border: 1px solid var(--divider);
      display: flex; align-items: center; justify-content: center;
    }
    .card-icon svg {
      width: 15px; height: 15px;
      stroke: var(--sub);
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .card-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--sub);
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="page">

    <button class="theme-btn" id="themeToggle" title="Toggle light / dark">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
      <span id="themeLabel"></span>
    </button>

    <p class="wordmark">Tera5G Browser</p>

    <!-- ── Central search bar ── -->
    <div class="search-wrap">
      <div class="search-box" id="searchBox">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.5" y1="16.5" x2="22" y2="22"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search or enter address" autocomplete="off" spellcheck="false"/>
        <button class="search-go" id="searchGo" tabindex="-1">
          <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="relay">
      <div class="relay-dot"></div>
      <span class="relay-text">Relay Active</span>
    </div>

    <p class="label">Favourites</p>

    <div class="grid">
      <div class="card" data-url="https://google.com">
        <div class="card-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg></div>
        <span class="card-name">Google</span>
      </div>
      <div class="card" data-url="https://en.m.wikipedia.org">
        <div class="card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 1 0 20 14.5 14.5 0 0 1 0-20"/><line x1="2" y1="12" x2="22" y2="12"/></svg></div>
        <span class="card-name">Wikipedia</span>
      </div>
      <div class="card" data-url="https://github.com">
        <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg></div>
        <span class="card-name">GitHub</span>
      </div>
      <div class="card" data-url="https://duckduckgo.com">
        <div class="card-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg></div>
        <span class="card-name">DuckDuckGo</span>
      </div>
      <div class="card" data-url="https://lite.cnn.com">
        <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 1 1-4 0V6"/><line x1="10" y1="7" x2="18" y2="7"/><line x1="10" y1="11" x2="18" y2="11"/><line x1="10" y1="15" x2="14" y2="15"/></svg></div>
        <span class="card-name">CNN Lite</span>
      </div>
      <div class="card" data-url="https://fast.com">
        <div class="card-icon"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
        <span class="card-name">Speed Test</span>
      </div>
      <div class="card" data-url="https://httpbin.org/get">
        <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.22-8.56"/><polyline points="21 3 21 9 15 9"/></svg></div>
        <span class="card-name">HTTPBin</span>
      </div>
      <div class="card" data-url="https://example.com">
        <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div>
        <span class="card-name">Example</span>
      </div>
    </div>

  </div>

  <script>
    // ── Helpers ───────────────────────────────────────────────────────────────
    function navigate(url) {
      if (window.tab && typeof window.tab.navigate === 'function') {
        window.tab.navigate(url);
      } else {
        window.location.href = url;
      }
    }

    function resolveQuery(raw) {
      var v = raw.trim();
      if (!v) return null;
      if (/^[a-z][a-z0-9+\-.]*:\/\//i.test(v)) return v;
      if (/^localhost(:\d+)?(\/|$)/.test(v) || /^(\d{1,3}\.){3}\d{1,3}(:\d+)?(\/|$)/.test(v)) return 'http://' + v;
      if (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/|$)/.test(v)) return 'https://' + v;
      return 'https://www.google.com/search?q=' + encodeURIComponent(v);
    }

    // ── Theme ─────────────────────────────────────────────────────────────────
    var SUN_SVG  = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    var MOON_SVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>';

    var html   = document.documentElement;
    var icon   = document.getElementById('themeIcon');
    var label  = document.getElementById('themeLabel');
    var saved  = localStorage.getItem('tera5g-theme') || 'dark';

    function applyTheme(t) {
      html.setAttribute('data-theme', t);
      localStorage.setItem('tera5g-theme', t);
      if (t === 'dark') { icon.innerHTML = SUN_SVG;  label.textContent = 'Light'; }
      else              { icon.innerHTML = MOON_SVG; label.textContent = 'Dark';  }
    }

    applyTheme(saved);

    document.getElementById('themeToggle').addEventListener('click', function() {
      applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    // ── Search bar ────────────────────────────────────────────────────────────
    var box   = document.getElementById('searchBox');
    var input = document.getElementById('searchInput');
    var goBtn = document.getElementById('searchGo');

    box.addEventListener('click', function() { input.focus(); });

    input.addEventListener('focus', function() {
      box.classList.add('focused');
    });
    input.addEventListener('blur', function() {
      box.classList.remove('focused');
    });
    input.addEventListener('input', function() {
      goBtn.classList.toggle('visible', this.value.length > 0);
    });
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var url = resolveQuery(this.value);
        if (url) navigate(url);
      }
      if (e.key === 'Escape') { this.value = ''; goBtn.classList.remove('visible'); this.blur(); }
    });

    goBtn.addEventListener('click', function() {
      var url = resolveQuery(input.value);
      if (url) navigate(url);
    });

    // ── Shortcut cards ────────────────────────────────────────────────────────
    document.querySelectorAll('.card').forEach(function(card) {
      card.addEventListener('click', function() {
        var url = this.getAttribute('data-url');
        if (url) navigate(url);
      });
    });
  </script>
</body>
</html>
